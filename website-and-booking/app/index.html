/** One tap = one code. Free and Half price create a single-use code; HALOE20 already exists, so it only copies. */
async function quickTap(kind) {
  if (S.quickBusy) return;
  S.quickBusy = true; S.quickSel = kind;
  const release = () => { setTimeout(() => { S.quickBusy = false; document.querySelectorAll('[data-quick]').forEach((b) => { b.disabled = false; }); }, 1000); };      // a second tap within a second does nothing
  if (kind === 'haloe') {
    const h = haloe20State();
    if (!h.ok) { S.codeReady = null; render(); toastMsg('HALOE20 is ' + h.line.toLowerCase()); release(); return; }
    S.codeReady = { code: 'HALOE20', desc: '20% off · ' + h.line, id: null };
    const ok = await copyText('HALOE20'); render(); toastMsg(ok ? 'Copied' : 'Couldn’t copy'); release(); return;
  }
  render();
  try {
    let code = '', tries = 0;
    do { code = QUICK[kind].prefix + codeSuffix(); } while (S.data.codes.some((c) => c.code === code) && ++tries < 8);
    const saved = await api.createCode(quickRow(kind, code));
    (S.raw.codes || (S.raw.codes = [])).push(saved); if (S.data !== S.raw && !S.data.codes.includes(saved)) S.data.codes.push(saved);
    S.codeReady = { code, desc: codeDesc(saved), id: saved.id };
    render(); toastMsg('Code ready');
  } catch (err) { S.codeReady = null; S.quickSel = null; render(); toastMsg(friendly(err, 'save')); }
  release();
}

const AFTERCARE_PHOTO_LINE = AFTERCARE_COPY.photoLine;

const daysBetween = (fromISO, toISO) => Math.round((Date.parse(toISO + 'T12:00:00Z') - Date.parse(fromISO + 'T12:00:00Z')) / 86400000);
/** Which set(s) apply to a booking: from the treatment she booked; a name nothing matches keeps the original hijama wording. */
const kindsForBooking = (b) => { const k = AFTERCARE_COPY.kindsOf(b && b.treatment); return k.length ? k : ['hijama']; };
/** Set(s) for the guide when nothing is current: her most recent session (done, else booked); hijama if there is none. */
function aftercareKinds(bookings) {
  const live = bookings.filter((b) => b.status === 'confirmed' && !AFTERCARE_COPY.isCoachingOnly(b.treatment));   // coaching-only sessions have no aftercare
  const done = live.filter((b) => b.done_at).sort((x, y) => String(y.done_at).localeCompare(String(x.done_at)));
  const latest = done[0] || live.sort((x, y) => String(y.booking_date).localeCompare(String(x.booking_date)))[0];
  return latest ? kindsForBooking(latest) : (bookings.some((b) => b.status === 'confirmed' && AFTERCARE_COPY.isCoachingOnly(b.treatment)) ? [] : ['hijama']);
}
/** Where she is in the 14 days after her most recent session marked done; null when there's nothing to show. */
function aftercareState(bookings) {
  const done = bookings.filter((b) => b.done_at && b.status === 'confirmed' && !AFTERCARE_COPY.isCoachingOnly(b.treatment)).sort((a, b) => String(b.done_at).localeCompare(String(a.done_at)));
  if (!done.length) return null;
  const day = daysBetween(ldn(new Date(done[0].done_at)), todayISO());
  if (day < 0 || day > 14) return null;
  const kinds = kindsForBooking(done[0]);
  let idx = 0; AFTERCARE_COPY.sets[kinds[0]].steps.forEach((st, i) => { if (st.at <= day) idx = i; });
  return { booking: done[0], day, idx, kinds };
}

  return '<div class="card" id="aftercareCard"><div class="section-label">Aftercare</div>' +
    '<p class="muted small" style="margin:8px 0 0">' + (state.day === 0 ? 'Your session was today.' : state.day === 1 ? 'Your session was yesterday.' : 'Your session was ' + state.day + ' days ago.') + (intro ? ' ' + esc(intro) : '') + '</p>' +
    timelineHTML(state, false) +
    '<a class="btn block" style="margin-top:16px" href="#/aftercare">See the full aftercare guide</a>' + (state.kinds.includes('hijama') ? photoCtaHTML('photoBtnCard', true) : '') + '</div>';
}
function viewAftercare() {
  const state = aftercareState(S.cdata.bookings), kinds = state ? state.kinds : aftercareKinds(S.cdata.bookings), intro = introFor(kinds);
  if (!kinds.length) { shell(pageHead('Aftercare') + '<div class="card"><div class="section-label">Your timeline</div><p class="muted" style="margin:10px 0 0">Nothing to follow after a coaching session. If you book a treatment, its aftercare guide will appear here.</p><a class="btn block" style="margin-top:16px" href="/book">Book a session</a></div>'); return; }
  shell(pageHead('Aftercare') +
    '<div class="card"><div class="section-label">Your timeline</div><p class="muted small" style="margin:8px 0 0">' + (state ? esc((intro ? intro + ' ' : '') + 'You are on the highlighted step.') : 'Nothing to follow right now. This guide shows what to expect over the 14 days after a session.') + '</p>' + timelineHTML(state, true, kinds) + '</div>' +
    (kinds.includes('hijama') ? '<div class="card blister"><div class="section-label">A small blister?</div><p style="margin:10px 0 0">' + esc(BLISTER_GUIDANCE) + '</p>' + (S.cdata.client ? photoCtaHTML('photoBtnPage', true) : '') + '</div>' : ''));
  const pb = document.getElementById('photoBtnPage'); if (pb) pb.onclick = openPhotoSheet;
}

/** Shrink a photo in the browser: longest side ≤ 1600px, JPEG ≤ ~1.5 MB. Re-encoding also drops EXIF (location etc.). */
async function compressImage(file, maxBytes = 1.5 * 1024 * 1024, maxSide = 1600) {
  // Some browsers report an empty type for iPhone HEIC/HEIF files, so the extension counts too.
  if (!/^image\//.test(file.type || '') && !/\.(jpe?g|png|webp|heic|heif)$/i.test(file.name || '')) throw new Error('not_image');
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error(/hei[cf]/i.test((file.type || '') + (file.name || '')) ? 'heic_unsupported' : 'unreadable')); }; im.src = u; }); }
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
  let scale = Math.min(1, maxSide / Math.max(w0, h0)), q = 0.86, blob = null;
  for (let i = 0; i < 12; i++) {
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w0 * scale)); c.height = Math.max(1, Math.round(h0 * scale));
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
    blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', q));
    if (blob && blob.size <= maxBytes) break;
    if (q > 0.56) q -= 0.1; else scale *= 0.8;
  }
  if (bmp.close) bmp.close();
  if (!blob || blob.size > maxBytes) throw new Error('too_large');
  return blob;
}

function openPhotoSheet() {
  const client = S.cdata && S.cdata.client; if (!client) return;
  // The photo belongs to the session she has most recently HAD (on or before today); only if there is none, her latest booking.
  const mine = S.cdata.bookings.filter(confirmed).sort(byDateDesc);
  const latest = mine.find((b) => b.booking_date <= todayISO()) || mine[0] || null;
  const picked = [];                                          // { blob, url }
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Send Halima a photo"><div class="grab"></div>' +
    '<div class="lab">Send Halima a photo</div>' +
    '<div class="picks"><label class="btn" for="phCam">Take a photo</label><label class="btn" for="phPick">Choose photos</label></div>' +
    '<input id="phCam" type="file" accept="image/*" capture="environment" hidden><input id="phPick" type="file" accept="image/*" multiple hidden>' +
    '<div class="thumbs" id="phThumbs"></div><p class="muted small" id="phCount" style="margin:8px 0 0">Up to 3 photos.</p>' +
    '<label class="f" for="phNote">Add a note (optional)</label><textarea class="note" id="phNote" maxlength="1000" style="min-height:84px" placeholder="In your own words"></textarea>' +
    '<p class="consent">Only you and Halima can see this. Please photograph the mark itself only.</p>' +
    '<div class="sheet-actions"><button class="btn ghost" id="phCancel" type="button">Cancel</button><button class="btn" id="phSend" type="button" disabled>Send to Halima</button></div></div>';
  document.body.appendChild(bg);
  const $ = (id) => bg.querySelector('#' + id);
  const close = () => { picked.forEach((p) => URL.revokeObjectURL(p.url)); bg.remove(); };
  const draw = () => {
    $('phThumbs').innerHTML = picked.map((p, i) => '<div class="th"><img alt="Photo ' + (i + 1) + '" src="' + p.url + '"><button type="button" data-rm="' + i + '" aria-label="Remove photo ' + (i + 1) + '"><span>×</span></button></div>').join('');
    $('phCount').textContent = picked.length ? picked.length + ' of 3 photos' : 'Up to 3 photos.';
    $('phSend').disabled = !picked.length;
    bg.querySelectorAll('[data-rm]').forEach((b) => { b.onclick = () => { const [r] = picked.splice(Number(b.dataset.rm), 1); URL.revokeObjectURL(r.url); draw(); }; });
  };
  const add = async (files) => {
    for (const f of [...files]) {
      if (picked.length >= 3) { toastMsg('Up to 3 photos'); break; }
      try { const blob = await compressImage(f); picked.push({ blob, url: URL.createObjectURL(blob) }); }
      catch (e) { toastMsg(e.message === 'not_image' ? 'That file isn’t a photo' : e.message === 'heic_unsupported' ? 'This phone can’t open that photo type here. Please choose a JPEG or PNG, or take a new photo.' : 'That photo couldn’t be used'); }
    }
    draw();
  };
  $('phCam').onchange = (e) => { add(e.target.files); e.target.value = ''; };
  $('phPick').onchange = (e) => { add(e.target.files); e.target.value = ''; };
  $('phCancel').onclick = close;
  bg.onclick = (e) => { if (e.target === bg) close(); };
  $('phSend').onclick = async () => {
    const btn = $('phSend'); if (navigator.onLine === false) { toastMsg(OFFLINE_MSG); return; }     // keep the photos and note; nothing is lost
    btn.disabled = true; btn.textContent = 'Sending…';
    const done = [];
    try {
      const stamp = Date.now();
      for (let i = 0; i < picked.length; i++) {
        const path = client.id + '/' + stamp + '-' + i + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
        await api.uploadPhoto(path, picked[i].blob); done.push(path);
      }
      const row = await api.addPhotoSubmission({ client_id: client.id, booking_id: latest ? latest.id : null, note: $('phNote').value.trim() || null, paths: done });
      api.alertPhoto(row.id).catch(() => {});                  // Halima is told by push + email; a failure here never undoes the upload
      close(); toastMsg('Sent. Halima will take a look.');
    } catch (e) {
      try { await api.removePhotos(done); } catch (x) {}       // don't leave orphaned files behind
      toastMsg(friendly(e, 'send')); btn.disabled = false; btn.textContent = 'Send to Halima';
    }
  };
}

/* A failed first load: one calm line and a way to try again (the session is kept). */
function loadErrorHTML() { return '<div class="state" role="alert"><b>Couldn’t load</b><span>' + esc(S.error) + '</span><button class="btn ghost" id="retryLoad" type="button">Try again</button></div>'; }
function loadingHTML() { return '<div class="skel" role="status" aria-busy="true" aria-label="Loading"><i></i><i></i><i></i><i></i></div>'; }
function stateHTML(title, hint, btn) { return '<div class="state"><b>' + esc(title) + '</b>' + (hint ? '<span>' + esc(hint) + '</span>' : '') + (btn || '') + '</div>'; }
document.addEventListener('click', (ev) => { if (ev.target && ev.target.id === 'retryLoad' && S.session) { S.error = null; const sess = S.session; S.session = null; enter(sess); } });

/* ---------- router / boot ---------- */
const ADMIN_VIEWS = ['today', 'inbox', 'clients', 'pipeline', 'codes', 'stats', 'settings'], CLIENT_VIEWS = ['home', 'progress', 'book', 'aftercare', 'notes', 'settings'];
function route() {
  const h = (location.hash || (clientUI() ? '#/home' : '#/today')).replace(/^#\//, '');
  const [path, qs] = h.split('?');
  const parts = path.split('/');
  if (!clientUI() && parts[0] === 'brief') { S.view = 'brief'; S.briefKey = parts[1] + '/' + parts[2]; S.briefBid = new URLSearchParams(qs || '').get('b'); }
  else if (clientUI()) S.view = CLIENT_VIEWS.includes(parts[0]) ? parts[0] : 'home';
  else S.view = ADMIN_VIEWS.includes(parts[0]) ? parts[0] : 'today';
  S.threadPhone = S.view === 'inbox' && parts[1] ? parts[1] : null;
  if (S.view !== 'brief') S.briefRetried = null;
}
window.addEventListener('scroll', () => document.body.classList.toggle('scrolled', window.scrollY > 40), { passive: true });
function render() {
  if (!S.session) { document.body.classList.remove('tilebg', 'ios-today', 'scrolled'); return viewLogin(); }
  if (S.needPassword) return viewCreatePassword();
  clearInterval(S.loginTimer);
  document.body.classList.remove('tilebg');
  if (S.admin && !S.preview) {
    if (!S.data) { shell(S.error ? loadErrorHTML() : loadingHTML(), false); return; }
    route();
    if (!S.voiceTried) { S.voiceTried = true; initVoice(); }
    clearInterval(S.inboxTimer);
    document.body.classList.toggle('ios-today', S.view === 'today');
    document.body.classList.toggle('tilebg', ['today', 'inbox', 'clients', 'pipeline', 'codes', 'stats', 'settings'].includes(S.view));
    if (S.view !== 'codes') { S.codeReady = null; S.quickSel = null; }
    window.scrollTo(0, 0);
    ({ today: viewToday, inbox: viewInbox, clients: viewClients, pipeline: viewPipeline, codes: viewCodes, stats: viewStats, settings: viewSettings, brief: () => viewBrief(S.briefKey, S.briefBid) })[S.view]();
    return;
  }
  // client
  if (!S.cdata) { shell(S.error ? loadErrorHTML() : loadingHTML(), false); return; }
  route();
  if (!S.cdata.client && !S.cdata.bookings.length && S.view !== 'settings') return viewNoMatch();      // nothing of theirs on file yet (the gear → Settings still works)
  window.scrollTo(0, 0);
  ({ home: viewHome, progress: viewProgress, book: viewBook, aftercare: viewAftercare, notes: viewNotes, settings: viewSettings })[S.view]();
}
async function refreshData() { await loadAdminData(); render(); }
async function enter(session) {
  if (!session) return clearSession();
  S.session = session;
  S.admin = false; S.isClient = false; S.data = null; S.raw = null; S.cdata = null; S.error = null;
  // Before anything else: a password must exist (and be freshly chosen after any code / link sign-in).
  if (needsPassword(session)) { S.needPassword = true; return viewCreatePassword(); }
  S.needPassword = false;
  const { data: prof } = await sb.from('profiles').select('role,client_id').eq('id', session.user.id).maybeSingle();
  if (prof && prof.role === 'admin') {
    // Admin app: nothing is loaded unless profiles.role = 'admin' (and RLS would refuse anyway).
    S.admin = true; render();
    try { await loadAdminData(); } catch (e) { S.error = friendly(e, 'load').replace("That didn't load.", "That didn't load just now."); }
    return render();
  }
  // Client: link to their clients row by email (case-insensitive) or phone — re-tried on every sign-in,
  // since the intake form may have been submitted after their first visit here.
  S.isClient = true; render();
  if (!(prof && prof.client_id)) await api.linkMyClient();
  try { S.cdata = await api.loadClient(); } catch (e) { S.error = friendly(e, 'load').replace("That didn't load.", "That didn't load just now."); }
  render();
}
window.addEventListener('hashchange', () => { if ((S.admin && S.data) || (S.isClient && S.cdata) || S.preview) render(); });
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === 'SIGNED_OUT') enter(null);
  else if (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION') { if (!S.session || S.session.user.id !== (session && session.user.id)) setTimeout(() => enter(session), 0); }
});
// A tapped alert asks the open app to move to that booking (the service worker posts this message).
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'open' && typeof e.data.url === 'string' && S.admin) { const h = new URL(e.data.url, location.origin).hash; if (h) location.hash = h; }
});
window.haloe = { api, S, render, pushApi, sb };       // exposed for local testing; holds no data until an admin signs in
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' }).catch(() => {}));
</script>

<style>
  @font-face { font-family: 'Tan Ashford'; src: url('/fonts/TAN-ASHFORD.woff2') format('woff2'), url('/fonts/TAN-ASHFORD.woff') format('woff'); font-weight: normal; font-style: normal; font-display: swap; }
  /* haloe practitioner app. Tokens come from /app/app-base.css (the app's own copy of the original calm tokens, so the site's shared stylesheets can change without touching the app); this file adds the
     app shell (header, floating nav), the dark theme, and the screens. */
  :root {
    --font: 'Poppins', -apple-system, 'Segoe UI', Arial, sans-serif;
    --font-wordmark: 'Tan Ashford', Georgia, serif;
    --red: #B3402F; --red-bg: #FBEAE6; --red-line: #E9B9AF;
    --green: #2F6B3F; --green-bg: #E7F1E8; --green-line: #B5D3B9;
    --nav-h: 88px;
    --tagline: #7A5F25;
    --arr-muted: #6B5E4B;
  }
  :root[data-theme="dark"] {
    --page-bg: #16140F; --card: #211E17; --fill: #2C281F; --fill-hover: #353026;
    --ink: #F3EEE3; --muted: #A89F8B; --gold-deep: #D7BC82;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    --red: #F0907F; --red-bg: #3A1F1A; --red-line: #6B3329;
    --green: #8CCB98; --green-bg: #1B2E20; --green-line: #34573B;
    --tagline: #D7BC82;
    --arr-muted: var(--muted);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #16140F; --card: #211E17; --fill: #2C281F; --fill-hover: #353026;
      --ink: #F3EEE3; --muted: #A89F8B; --gold-deep: #D7BC82;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
      --red: #F0907F; --red-bg: #3A1F1A; --red-line: #6B3329;
      --green: #8CCB98; --green-bg: #1B2E20; --green-line: #34573B;
      --tagline: #D7BC82;
      --arr-muted: var(--muted);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 78%; color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  body { margin: 0; font-family: var(--font); background: var(--page-bg); color: var(--ink); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  /* sign-in: "Arrival" — centred mark + big wordmark, one calm column, no card */
  .login-top { display: flex; justify-content: flex-end; padding: calc(10px + env(safe-area-inset-top)) 16px 0; }
  .arrival, .arrival button, .arrival input { font-family: var(--font); }
  .arrival { min-height: calc(100vh - 66px - env(safe-area-inset-top)); min-height: calc(100svh - 66px - env(safe-area-inset-top)); max-width: 480px; margin: 0 auto; padding: 0 24px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; }
  .arr-brand { text-align: center; margin-top: 4px; width: 100%; }
  .arr-mark { width: 64px; height: 64px; display: block; margin: 0 auto; }
  .arr-word { font-family: var(--font-wordmark); font-size: 72px; line-height: 1; color: #111; margin-top: 30px; letter-spacing: 0.005em; }
  :root[data-theme="dark"] .arr-word { color: var(--ink); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .arr-word { color: var(--ink); } }
  .arr-tag { font-size: 14px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: var(--tagline); margin: 12px 0 0; padding-left: 0.28em; white-space: nowrap; }
  .arr-lower { width: 100%; margin-top: auto; padding-top: 32px; }
  .arr-h { font-family: var(--font); font-weight: 500; font-size: 30px; line-height: 1.2; letter-spacing: -0.01em; color: var(--ink); margin: 0 0 10px; outline: none; }
  .arr-sub { font-family: var(--font); font-weight: 400; font-size: 16px; line-height: 1.55; color: var(--arr-muted); margin: 0 0 26px; }
  .arr-sub b { color: var(--ink); font-weight: 400; overflow-wrap: anywhere; }
  .arr-label { display: block; font-size: 14px; font-weight: 500; letter-spacing: 0.06em; color: var(--muted); }
  .arr-input { display: block; width: 100%; height: 52px; padding: 0; border: 0; border-bottom: 2px solid color-mix(in srgb, var(--ink) 40%, transparent); border-radius: 0; background: transparent; color: var(--ink); font: inherit; font-size: 18px; outline: none; -webkit-appearance: none; appearance: none; }
  .arr-input::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
  .arr-input:focus { border-bottom-color: var(--gold); box-shadow: 0 2px 0 var(--gold); }
  .arr-input:-webkit-autofill, .arr-input:-webkit-autofill:focus { -webkit-box-shadow: 0 0 0 100px var(--page-bg) inset; -webkit-text-fill-color: var(--ink); transition: background-color 100000s; }
  .arr-btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; margin-top: 24px; border: 0; border-radius: 999px; background: var(--gold); color: #1C1A16; font: inherit; font-size: 17px; font-weight: 600; }
  .arr-btn[disabled] { cursor: default; opacity: .6; }
  .arr-field { position: relative; }
  .arr-field .arr-input { padding-right: 52px; }
  .arr-hint { margin: 8px 0 0; font-size: 14px; line-height: 1.45; color: var(--arr-muted); }
  .arr-eye { position: absolute; right: 0; top: 4px; width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--muted); cursor: pointer; }
  .arr-eye svg { width: 22px; height: 22px; }
  .arr-eye[aria-pressed="true"] { color: var(--gold-deep); }
  .arr-code { text-align: center; font-size: 30px; letter-spacing: .5em; padding-left: .5em; font-variant-numeric: tabular-nums; }
  .arr-hidden-user { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .arr-btn.ghost { background: var(--fill); color: var(--ink); margin-top: 16px; }
  .arr-btn.ghost[disabled] { color: var(--muted); }
  .arr-textbtn { display: block; margin: 6px auto 0; min-height: 48px; padding: 0 16px; border: 0; background: none; color: var(--gold-deep); font: inherit; font-size: 15px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
  .arr-card { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); }
  .arr-card p { margin: 0; }
  .arr-card .t { font-size: 16px; font-weight: 600; line-height: 1.4; }
  .arr-card .s { font-size: 15px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
  .arr-err { margin: 12px 0 0; font-size: 14px; line-height: 1.45; color: var(--arr-muted); text-align: center; }
  .arr-err:empty { display: none; }
  .arr-foot { width: 100%; margin-top: 22px; text-align: center; font-size: 14px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .arr-foot a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; color: var(--gold-deep); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; font: inherit; font-size: 14px; font-weight: 500; }
  .arr-foot span { line-height: 1.5; }

  /* header */
  .app-head { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: calc(6px + env(safe-area-inset-top)) 16px 6px; background: color-mix(in srgb, var(--page-bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand img { width: 30px; height: 30px; display: block; }
  .brand span { font-family: var(--font-wordmark); font-size: 28px; line-height: 1; color: #111; letter-spacing: 0.01em; }
  :root[data-theme="dark"] .brand span { color: var(--ink); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand span { color: var(--ink); } }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--fill); display: grid; place-items: center; color: var(--ink); }
  .icon-btn svg { width: 20px; height: 20px; }
  .head-actions { display: flex; gap: 8px; }

  .wrap { max-width: 600px; margin: 0 auto; padding: 8px 16px calc(var(--nav-h) + env(safe-area-inset-bottom)); }
  .eyebrow { font-size: 14px; font-weight: 500; color: var(--gold-deep); margin: 10px 4px 2px; }
  h1.screen { font-family: var(--font); font-weight: 700; font-size: 36px; line-height: 1.12; letter-spacing: -0.02em; margin: 0 4px 18px; color: var(--ink); }
  h2.sub { font-size: 14px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 24px 4px 12px; }
  .lab { font-size: 14px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .card .section-label { color: var(--muted); }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }

  /* floating pill nav */
  .tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 30; width: min(calc(100% - 32px), 440px); display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 999px; box-shadow: 0 8px 30px rgba(40,30,10,.16), 0 1px 2px rgba(40,30,10,.08); }
  .tabbar.three { grid-template-columns: repeat(3, 1fr); }
  a.listrow { text-decoration: none; color: inherit; }
  a.btn.block { display: flex; }
  .nx-date { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin-top: 10px; }
  .nx-time { font-size: 20px; color: var(--gold-deep); font-weight: 500; margin-top: 2px; }
  .tabbar button { min-height: 52px; border: 0; background: transparent; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .tabbar button svg { width: 22px; height: 22px; }
  .tabbar button[aria-current="page"] { color: var(--gold-deep); font-weight: 600; }
  :root[data-theme="dark"] .tabbar button[aria-current="page"] { color: var(--gold); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabbar button[aria-current="page"] { color: var(--gold); } }

  /* cards + bits */
  .card { background: var(--card); border-radius: 24px; padding: 20px; margin: 0 0 16px; box-shadow: var(--shadow); }
  .card.tight { padding: 14px 16px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 14px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--fill); font-weight: 500; font-size: 14px; color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--gold); color: #1C1A16; }
  .pill { display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .pill.red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-line); }
  .pill.green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-line); }
  .pill.gold { background: var(--fill); color: var(--gold-deep); }
  .pill.amber { background: #FBF0D7; color: #8A5A00; }
  :root[data-theme="dark"] .pill.amber { background: #3A2E10; color: #E8B85A; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.amber { background: #3A2E10; color: #E8B85A; } }
  .tag { display: inline-flex; align-items: center; min-height: 24px; padding: 0 11px; border-radius: 999px; background: var(--gold); color: #1C1A16; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .gold-card { background: var(--gold); color: #1C1A16; }
  .gold-card .section-label { color: rgba(28,26,22,.65); }
  .gold-card .nx-time { color: #1C1A16; }
  .gold-card .btn { background: #1C1A16; color: #F5F0E8; }
  .gold-card .btn.ghost { background: rgba(28,26,22,.12); color: #1C1A16; }
  .gold-card .tag { background: rgba(28,26,22,.12); }
  .btn.sm { min-height: 44px; padding: 0 14px; font-size: 14px; }
  .h .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .day-label { font-size: 14px; font-weight: 500; color: var(--muted); margin: 18px 4px 8px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; }
  /* states (Oct 2026): empty = what it means + what to do; loading = skeleton, no layout jump; error = calm line + retry */
  .state { display: grid; gap: 6px; justify-items: center; text-align: center; padding: 20px 12px; }
  .state b { font-size: 16px; font-weight: 600; color: var(--th-ink, var(--ink)); }
  .state span { font-size: 15px; line-height: 1.5; color: var(--th-muted, var(--muted)); max-width: 30ch; }
  .state .btn { margin-top: 10px; }
  .skel { display: grid; gap: 16px; padding: 24px 16px; }
  .skel i { display: block; height: 88px; border-radius: 24px; background: var(--fill); animation: skel 1.4s ease-in-out infinite; }
  .skel i:first-child { height: 40px; width: 55%; border-radius: 12px; }
  .skel i:nth-child(3) { animation-delay: .2s; } .skel i:nth-child(4) { animation-delay: .4s; }
  @keyframes skel { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .skel i { animation: none; } }

  /* session rows (Today) */
  .sess .name { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
  .sess .time { color: var(--gold-deep); font-weight: 500; font-size: 14px; }
  .sess .meta { color: var(--muted); font-size: 14px; }
  .tick { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--fill-hover); background: transparent; display: grid; place-items: center; color: transparent; }
  .tick svg { width: 20px; height: 20px; }
  .tick[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
  .sess.done .name, .sess.done .meta, .sess.done .time { opacity: .5; }

  /* search + lists */
  .search { width: 100%; min-height: 48px; border-radius: 16px; border: 1px solid var(--fill-hover); background: var(--card); padding: 0 16px; margin-bottom: 14px; font-size: 16px; }
  .listrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 64px; padding: 12px 16px; border: 0; text-align: left; background: var(--card); border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 10px; }
  .listrow .nm { font-weight: 600; overflow-wrap: anywhere; }
  .listrow .sb { font-size: 14px; color: var(--muted); }

  /* brief */
  .back { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0 4px; color: var(--gold-deep); font-weight: 500; font-size: 15px; }
  .back svg { width: 18px; height: 18px; }
  .brief-name { font-family: var(--font); font-weight: 700; font-size: 28px; line-height: 1.2; letter-spacing: -0.02em; margin: 2px 0 6px; overflow-wrap: anywhere; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin-top: 14px; }
  .fact .k { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .fact .v { font-weight: 500; overflow-wrap: anywhere; }
  .fact.wide { grid-column: 1 / -1; }
  .contact { display: flex; gap: 8px; margin-top: 16px; }
  .btn { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--gold); color: #1C1A16; font-weight: 600; font-size: 15px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn.ghost { background: var(--fill); color: var(--ink); }
  .btn.block { width: 100%; }
  .btn.danger { background: var(--red); color: var(--card); }
  .h.cancelled { opacity: .62; }
  .mail { overflow-wrap: anywhere; word-break: break-word; }
  /* A button whose label may wrap to two lines ("Worried about a mark? Send Halima a photo"): grows with its text, never a fixed height. One-line gold buttons keep the plain .btn height. */
  .btn.multi { height: auto; min-height: 44px; padding: 14px 20px; line-height: 1.3; border-radius: 28px; text-align: center; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .sig { margin-top: 14px; display: flex; align-items: center; gap: 12px; }
  .sig .thumb { width: 120px; height: 54px; border-radius: 10px; background: #fff; border: 1px solid var(--fill-hover); object-fit: contain; }
  .act { background: var(--red-bg); }
  .act .section-label { color: var(--red); }
  .act ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 12px; }
  .act li { padding-left: 14px; position: relative; }
  .act li::before { content: ''; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
  .act li b { display: block; color: var(--ink); font-weight: 600; }
  .act li span { color: var(--ink); opacity: .85; }
  .clear { background: var(--green-bg); color: var(--green); font-weight: 600; }
  .inwords { font-family: var(--serif-text); font-size: 17px; line-height: 1.5; margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }   /* inside the brief (.kv) the shared scale below takes over */
  .inwords.none { color: var(--muted); font-style: italic; }
  .kv { display: grid; gap: 14px; }
  /* .kv .k label size/tracking come from the shared brief scale above */
  .hist { display: grid; gap: 10px; margin-top: 10px; }
  .hist .h { padding: 12px 14px; background: var(--fill); border-radius: 16px; font-size: 14px; }
  .hist .h b { font-weight: 600; }
  textarea.note { width: 100%; min-height: 110px; border-radius: 16px; border: 1px solid var(--fill-hover); background: var(--card); padding: 12px 14px; font-size: 16px; resize: vertical; }
  textarea.note.dictate { min-height: 140px; font-size: 16px; line-height: 1.5; }
  .note-saved { display: inline-block; margin-left: 12px; font-size: 14px; font-weight: 600; color: var(--gold-deep, #7A5F25); }
  .note-item { padding: 12px 14px; background: var(--fill); border-radius: 16px; margin-top: 10px; }
  .note-item .when { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .note-item p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

  /* codes */
  .codecard .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .codecard .code { font-weight: 600; font-size: 18px; letter-spacing: .02em; overflow-wrap: anywhere; }
  .codecard .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .codecard .stats .k { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .codecard .stats .v { font-weight: 600; }
  .switch { position: relative; width: 56px; height: 32px; border-radius: 999px; border: 0; background: var(--fill-hover); flex: 0 0 auto; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
  .switch[aria-checked="true"] { background: var(--gold); }
  .switch[aria-checked="true"]::after { transform: translateX(24px); }
  .switch-wrap { min-width: 44px; min-height: 44px; display: grid; place-items: center; background: none; border: 0; padding: 0; }
  .toggle-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; margin: 4px 4px 14px; font-size: 14px; }
  label.f { display: block; font-size: 14px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  .in { width: 100%; min-height: 48px; border-radius: 14px; border: 1px solid var(--fill-hover); background: var(--card); padding: 0 14px; font-size: 16px; }
  .warn { background: var(--red-bg); border: 1px solid var(--red-line); color: var(--ink); border-radius: 16px; padding: 12px 14px; font-size: 14px; margin-top: 14px; }

  /* stats */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .tiles.two { grid-template-columns: repeat(2, 1fr); }
  .tile { background: var(--card); border-radius: 24px; padding: 16px 14px; box-shadow: var(--shadow); min-width: 0; }
  .tile .k { font-size: 14px; color: var(--muted); }
  .tile .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-top: 6px; overflow-wrap: anywhere; }
  .tile .s { font-size: 14px; color: var(--muted); margin-top: 4px; line-height: 1.35; }

  /* Today hero */
  .hero { display: flex; align-items: center; gap: 18px; }
  .ring { width: 92px; height: 92px; flex: 0 0 auto; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .t { fill: none; stroke: var(--fill); stroke-width: 9; }
  .ring .p { fill: none; stroke: var(--gold); stroke-width: 9; stroke-linecap: round; transition: stroke-dasharray .4s; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .hero h2 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
  .hero p { margin: 4px 0 0; color: var(--muted); font-size: 14px; line-height: 1.4; }

  /* settings */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--fill); border-radius: 16px; margin-top: 12px; }
  .seg button { min-height: 44px; border: 0; border-radius: 12px; background: transparent; font-weight: 500; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }

  /* progress chart + check-in sheet */
  .pmode { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--fill); border-radius: 14px; margin: 12px 0 8px; }
  .pmode button { min-height: 44px; border: 0; border-radius: 10px; background: transparent; font-weight: 500; font-size: 14px; }
  .pmode button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  .chart { width: 100%; height: auto; display: block; margin-top: 4px; }
  .chart .grid { stroke: var(--fill-hover); stroke-width: 1; }
  .chart .ax { fill: var(--muted); font-size: 14px; font-family: var(--font); }
  .chart .ln { fill: none; stroke: var(--gold); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .ln2 { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 4 3; stroke-linejoin: round; stroke-linecap: round; }
  .chart .dot { fill: var(--card); stroke: var(--gold); stroke-width: 2; }
  .chart .dot2 { fill: var(--card); stroke: var(--muted); stroke-width: 1.6; }
  .delta { font-weight: 600; margin-top: 8px; }
  .legend { display: flex; gap: 14px; font-size: 14px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--gold); vertical-align: middle; margin-right: 6px; }
  .legend i.d { border-top: 2px dashed var(--muted); }
  .sheet-bg { position: fixed; inset: 0; z-index: 60; background: rgba(20,14,4,.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--card); width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; border-radius: 28px 28px 0 0; padding: 12px 20px calc(22px + env(safe-area-inset-bottom)); }
  .sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--fill-hover); margin: 0 auto 14px; }
  .slider-row { margin-top: 18px; }
  .slider-row .hd { display: flex; justify-content: space-between; align-items: baseline; }
  .slider-row .hd b { font-weight: 600; }
  .slider-row .hd span { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; min-width: 2ch; text-align: right; }
  .slider-row .hint { font-size: 14px; color: var(--muted); margin: 2px 0 2px; }
  .slider-row input[type=range] { width: 100%; height: 44px; accent-color: var(--gold); background: transparent; }
  .sheet-actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 22px; }
  .row-split { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--fill); }
  .row-split:last-child { border-bottom: 0; }

  /* login / gate */
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .gate .card { width: 100%; max-width: 420px; text-align: center; }
  .gate .brand { justify-content: center; margin-bottom: 18px; }
  /* Short confirmations: a light card in the middle of the screen, a gold tick, fades in, ~3 s, fades out. Never blocks taps. */
  #toastHost { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; pointer-events: none; }
  .toast { box-sizing: border-box; width: max-content; max-width: min(300px, calc(100vw - 32px)); padding: 18px 22px 16px; border-radius: 22px; background: var(--card); color: var(--ink); text-align: center; font-size: 15px; line-height: 1.45; box-shadow: 0 1px 2px rgba(60,44,12,.10), 0 12px 36px rgba(60,44,12,.22); border: 1px solid var(--hairline, rgba(120,100,60,.14)); display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0; transform: translateY(6px) scale(.98); transition: opacity .22s ease, transform .22s ease; pointer-events: none; }
  .toast.in { opacity: 1; transform: none; }
  .toast .tick { width: 26px; height: 26px; flex: none; color: var(--gold-deep); }
  :root[data-theme="dark"] .toast { background: var(--fill); box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 36px rgba(0,0,0,.5); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast { background: var(--fill); box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 36px rgba(0,0,0,.5); } }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; transform: none; } }
  /* ---- ONE spacing scale (4 · 8 · 12 · 16 · 24) and ONE type scale for the intake brief ----
   * The label/value grid below is used by the Today cards AND the client profile brief, so both look identical. */
  :root { --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --label-col: 132px;
          --t-label: 14px; --t-label-track: .06em; --t-value: 16px; --t-value-lh: 1.5; --t-pill: 14px; --t-tag: 14px; }
  .bgrid, .facts, .kv.rows > div { display: grid; grid-template-columns: var(--label-col) minmax(0, 1fr); gap: var(--s2); align-items: start; }
  .bgrid .gl-k, .fact .k, .kv.rows .k { font-size: var(--t-label); letter-spacing: var(--t-label-track); text-transform: uppercase; color: var(--muted); font-weight: 600; line-height: 1.4; padding-top: 4px; overflow-wrap: anywhere; }
  .bgrid .gl-v, .fact .v, .kv.rows .inwords { min-width: 0; margin: 0; font-size: var(--t-value); line-height: var(--t-value-lh); font-weight: 400; overflow-wrap: anywhere; }
  .fact { display: contents; }
  .facts { margin-top: var(--s3); }
  .kv.rows { display: grid; gap: var(--s2); }
  /* glance block on the session cards (admin home): chose · booked · why · medication — her words, verbatim */
  .sess .glance { grid-column: 1 / -1; margin-top: var(--s3); padding-top: var(--s3); border-top: 1px solid var(--fill-hover); cursor: pointer; }
  .glance .pkg { font-weight: 600; }
  .glance .booked { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s2); }
  .glance .flag { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--gold); color: #1C1A16; font-size: var(--t-tag); font-weight: 600; line-height: 1.4; }
  .glance .dim, .glance .med-none { color: var(--muted); }
  .glance .why { display: block; width: 100%; margin: -11px 0; padding: 11px 0; border: 0; background: none; color: var(--ink); font: inherit; font-size: var(--t-value); line-height: var(--t-value-lh); text-align: left; overflow-wrap: anywhere; cursor: pointer; }
  .glance .why .wtxt { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .glance .why[aria-expanded="true"] .wtxt { white-space: pre-wrap; overflow: visible; }
  .glance .med-text { display: block; padding: 6px 12px; border-radius: 14px; background: #FFE9A8; color: #3A2B00; font-weight: 500; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: inset 0 0 0 2px #E8B84A; }
  .glance .med-in { display: block; }
  .glance .med-sum { cursor: pointer; min-height: 44px; }
  .glance .med-full { display: block; white-space: pre-wrap; }
  .glance .med-text.clamp .med-in { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  :root[data-theme="dark"] .glance .med-text { background: #4A3A0E; color: #FFE9A8; box-shadow: inset 0 0 0 2px #B8892A; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .glance .med-text { background: #4A3A0E; color: #FFE9A8; box-shadow: inset 0 0 0 2px #B8892A; } }
  .glance .med-more { display: block; margin: -9px 0 -13px; padding: 13px 0; border: 0; background: none; color: var(--gold-deep); font: inherit; font-size: 14px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .glance .med-yes { display: inline-block; padding: 4px 12px; border-radius: 14px; box-shadow: inset 0 0 0 2px #E8B84A; font-weight: 500; }
  .glance .no-intake { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--gold); color: #1C1A16; font-size: var(--t-pill); font-weight: 500; line-height: 1.4; }
  /* Today: one rhythm — card padding 16, 12 between blocks, 8 between grid rows */
  .today .card { margin: 0 0 var(--s3); padding: var(--s4); }
  .today-date { margin: 0 var(--s1) var(--s2); font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-deep); }
  .statusrow { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); margin: 0 var(--s1) var(--s3); }
  .statusrow b { font-size: 17px; font-weight: 600; }
  .statusrow span { font-size: 14px; color: var(--muted); text-align: right; }
  .today .hero { gap: var(--s4); }
  .today .chips { padding: 0; margin: 0 0 var(--s3); }
  .today .subline { margin: 0 var(--s1) var(--s2); }
  .today .day-label { margin: var(--s3) var(--s1) var(--s2); }
  .sess { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--s3); row-gap: 0; align-items: start; padding: var(--s4); }
  .sess .who { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; text-align: left; background: none; border: 0; padding: 0; min-height: 44px; justify-content: flex-start; }
  .sess .row2 { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s2); }
  .sess .acts { grid-column: 1 / -1; display: flex; gap: var(--s2); margin-top: var(--s3); }
  .sess .acts .btn { min-height: 44px; padding: 0 var(--s4); white-space: nowrap; }
  .sess .acts .btn.grow { flex: 1; min-width: 0; }
  .sess.feature { padding: var(--s4); border: 2px solid var(--gold); }
  .sess.feature .name { font-size: 22px; line-height: 1.2; }
  .nextup-label { font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-deep); margin: 0 var(--s1) var(--s2); }

  /* aftercare timeline + photos */
  .tl { list-style: none; margin: 14px 0 0; padding: 0; position: relative; }
  .tl li { position: relative; padding: 0 0 18px 34px; }
  .tl li::before { content: ''; position: absolute; left: 9px; top: 22px; bottom: -2px; width: 2px; background: var(--fill-hover); }
  .tl li:last-child { padding-bottom: 0; }
  .tl li:last-child::before { display: none; }
  .tl .dot { position: absolute; left: 0; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--card); border: 2px solid var(--fill-hover); }
  .tl li.past .dot { background: var(--fill-hover); }
  .tl li.now .dot { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 0 5px color-mix(in srgb, var(--gold) 28%, transparent); }
  .tl .hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; min-height: 28px; }
  .tl .hd b { font-weight: 600; font-size: 16px; }
  .tl .hd span { font-size: 14px; color: var(--muted); }
  .tl li.now .hd b { color: var(--gold-deep); }
  :root[data-theme="dark"] .tl li.now .hd b { color: var(--gold); }
  .tl .body { margin-top: 6px; display: grid; gap: 8px; font-size: 15px; line-height: 1.5; }
  .tl .body p { margin: 0; }
  .tl-photo { margin: 14px 0 0; }
  .tl-kind { margin: 18px 0 0; font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .tl .safe { margin-top: 2px; }
  .tl-book { margin-top: 14px; min-height: 44px; }
  .tl li.future .body, .tl li.past .body { display: none; }
  .tl.all li .body { display: grid; }
  .tl.all li.future, .tl.all li.past { opacity: .72; }
  .blister { background: var(--fill); }
  .photo-cta { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; margin-top: 14px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--fill); color: var(--ink); font: inherit; font-weight: 600; font-size: 15px; }
  .picks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .picks .btn { cursor: pointer; padding: 0 10px; text-align: center; }
  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .thumbs .th { position: relative; aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: var(--fill); }
  .thumbs .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumbs .th button { position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: 0; background: transparent; padding: 0; }
  .thumbs .th button span { display: grid; place-items: center; width: 28px; height: 28px; margin: 8px 8px 0 auto; border-radius: 50%; background: rgba(28,26,22,.7); color: #fff; font-size: 16px; line-height: 1; }
  .consent { font-size: 14px; color: var(--muted); line-height: 1.5; margin: 14px 0 0; }
  .ph-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .ph-row .pt { width: 88px; height: 88px; padding: 0; border: 0; border-radius: 14px; overflow: hidden; background: var(--fill); }
  .ph-row .pt img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lightbox { position: fixed; inset: 0; z-index: 80; background: rgba(10,8,4,.92); display: grid; place-items: center; padding: 16px; }
  .lightbox img { max-width: 100%; max-height: 86vh; border-radius: 12px; }
  .lightbox button { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 10px; width: 48px; height: 48px; border: 0; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; font-size: 24px; }
  /* ============ "Tile home": the admin Today screen + the floating nav ============
   * Spacing tokens only (4 · 8 · 12 · 16 · 24, defined above). Tile radius 28px. Tap targets >= 44px. */
  :root { --th-page: linear-gradient(180deg, #F8F3EA 0%, #F2E6CE 100%); --th-ink: #1C1812; --th-muted: #6B5E4B; --th-gold: #C8A96E; --th-gold-text: #7A5F25; --th-sand: #EFE7D8; --th-dark: #2B2318;
          --th-tile: #FFFFFF; --th-hero: linear-gradient(135deg, #FFFFFF 0%, #FBF1D6 100%); --th-fill: linear-gradient(135deg, #E2CB93 0%, #C8A96E 100%); --th-circle: rgba(200, 169, 110, .30);
          --th-glass: rgba(255, 255, 255, .8); --th-pill: rgba(255, 255, 255, .5); --th-nav: rgba(255, 255, 255, .88); --th-shadow: 0 1px 2px rgba(60, 44, 12, .06), 0 8px 24px rgba(60, 44, 12, .08); --th-radius: 28px; }
  :root[data-theme="dark"] { --th-page: linear-gradient(180deg, #1C1812 0%, #16140F 100%); --th-ink: #F3EEE3; --th-muted: #A89F8B; --th-gold-text: #D7BC82; --th-sand: #2E291F; --th-dark: #3A2E1C;
          --th-tile: #211E17; --th-hero: linear-gradient(135deg, #211E17 0%, #30291A 100%); --th-fill: linear-gradient(135deg, #B89A5E 0%, #8F7442 100%); --th-circle: rgba(200, 169, 110, .22);
          --th-glass: rgba(43, 38, 28, .8); --th-pill: rgba(255, 255, 255, .06); --th-nav: rgba(33, 30, 23, .9); --th-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --th-page: linear-gradient(180deg, #1C1812 0%, #16140F 100%); --th-ink: #F3EEE3; --th-muted: #A89F8B; --th-gold-text: #D7BC82; --th-sand: #2E291F; --th-dark: #3A2E1C;
          --th-tile: #211E17; --th-hero: linear-gradient(135deg, #211E17 0%, #30291A 100%); --th-fill: linear-gradient(135deg, #B89A5E 0%, #8F7442 100%); --th-circle: rgba(200, 169, 110, .22);
          --th-glass: rgba(43, 38, 28, .8); --th-pill: rgba(255, 255, 255, .06); --th-nav: rgba(33, 30, 23, .9); --th-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35); } }
  body.tilebg { background: var(--th-page); background-attachment: fixed; }
  body.tilebg .app-head { background: var(--th-page); background-attachment: fixed; -webkit-backdrop-filter: none; backdrop-filter: none; }
  body.tilebg .icon-btn { background: var(--th-glass); }
  /* ---- Today: plain list, sized like Gmail (16px names and lines, 14px notes, 72px+ rows, hairlines) ---- */
  .tr-list { background: var(--th-tile); border-radius: 16px; border: 1px solid var(--edge); overflow: hidden; }
  .tr { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s2) 0 var(--s4); border-top: 1px solid var(--edge); }
  .tr:first-child { border-top: 0; }
  .tr.done { opacity: .5; }
  .tr-main { flex: 1; min-width: 0; display: grid; gap: 2px; padding: var(--s3) 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .tr-name { font-size: 18px; line-height: 1.35; font-weight: 600; color: var(--th-ink); }
  .tr-line { font-size: 16px; line-height: 1.4; color: var(--th-muted); }
  .tr-note { font-size: 14px; line-height: 1.4; font-weight: 500; color: var(--th-gold-text); }
  .tr .tick { position: static; flex: none; }
  .tr-empty { margin: var(--s5) var(--s1); font-size: 18px; color: var(--th-muted); }
  .th-tabs.two { grid-template-columns: 1fr 1fr; }
  .tr-day { margin: 0 0 var(--s4); }
  .tr-day h2 { margin: 0 var(--s1) var(--s2); font-size: 16px; line-height: 1.4; font-weight: 600; color: var(--th-muted); }
  .tr-day.now h2 { color: var(--th-gold-text); }
  .tr-none { margin: 0 var(--s1); font-size: 16px; color: var(--th-muted); opacity: .7; }
  .th-tabs { display: grid; grid-template-columns: repeat(3, 1fr); height: 52px; padding: var(--s1); margin: 0 0 var(--s3); border-radius: 999px; background: var(--th-pill); }
  .th-tabs button { min-height: 44px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 15px; font-weight: 500; color: var(--th-muted); }
  .th-tabs button[aria-selected="true"] { background: var(--th-tile); color: var(--th-ink); font-weight: 600; box-shadow: var(--th-shadow); }
  .tile-home .tile { position: relative; overflow: hidden; background: var(--th-tile); color: var(--th-ink); border-radius: var(--th-radius); padding: var(--s4); margin: 0 0 var(--s3); box-shadow: var(--th-shadow); }
  .tile-home .tile.th-hero { background: var(--th-hero); padding: var(--s5) var(--s4); }
  .tile-home .tile.th-hero::after { content: ''; position: absolute; right: -24px; top: -24px; width: 120px; height: 120px; border-radius: 50%; background: var(--th-circle); }
  .tile-home .tile.th-hero > * { position: relative; z-index: 1; }
  .tile-home .tile.th-hero .th-date { font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--th-gold-text); }
  .tile-home .tile.th-hero h2 { margin: var(--s2) 0 var(--s1); font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; }
  .tile-home .tile.th-hero p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--th-muted); }
  .th-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); margin: 0 0 var(--s2); }
  .th-title { margin: 0; font-size: 17px; line-height: 1.3; font-weight: 600; }
  .th-count { font-size: 14px; font-weight: 600; color: var(--th-gold-text); white-space: nowrap; }

  @media (min-width: 700px) { .wrap { padding-top: 16px; } }

  /* Salon scale (Oct 2026): one size across every screen, matching the Clients tab.
     Cards 16px radius / 16px padding / hairline edge / no shadow; titles 30px; compact tiles. */
  :root { --th-radius: 16px; --edge: color-mix(in srgb, var(--muted) 22%, transparent); }

  .th-titlerow h1 { font-size: 30px; }
  .nx-date { font-size: 22px; }
  .brief-name { font-size: 24px; }
  .card { border-radius: 16px; padding: 16px; box-shadow: none; border: 1px solid var(--edge); }
  .tile { border-radius: 16px; box-shadow: none; border: 1px solid var(--edge); }

  .tile-home .tile, .tile-home .card, .st-mini { border: 1px solid var(--edge); }

  /* ===== iOS refresh (Oct 2026): Today / This week, header, nav. Tokens are defined once here; nothing below hard-codes a colour. ===== */
  :root { --ios-bg: #F7F3EC; --ios-card: #FFFFFF; --ios-text: #1C1A17; --ios-text2: #8A8378; --ios-hair: rgba(28, 26, 23, .08);
          --ios-gold: #B89B5E; --ios-gold-tint: rgba(184, 155, 94, .12); --ios-success: #8FB39A; --ios-radius: 20px;
          --ios-shadow: 0 1px 3px rgba(0, 0, 0, .04); --ios-blur-bg: rgba(247, 243, 236, .7); --ios-thumb-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 3px 8px rgba(0, 0, 0, .06); }
  :root[data-theme="dark"] { --ios-bg: #14120F; --ios-card: #1E1B17; --ios-text: #F5F1EA; --ios-text2: #9A9387; --ios-hair: rgba(245, 241, 234, .10); --ios-blur-bg: rgba(20, 18, 15, .7); --ios-thumb-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ios-bg: #14120F; --ios-card: #1E1B17; --ios-text: #F5F1EA; --ios-text2: #9A9387; --ios-hair: rgba(245, 241, 234, .10); --ios-blur-bg: rgba(20, 18, 15, .7); --ios-thumb-shadow: 0 1px 3px rgba(0, 0, 0, .5); } }
  body.ios-today { background: var(--ios-bg); }
  /* 1 · header */
  body.ios-today .app-head { position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: calc(6px + env(safe-area-inset-top)) 16px 6px; background: transparent; border-bottom: 1px solid transparent; transition: background-color 200ms ease, border-color 200ms ease; }
  body.ios-today.scrolled .app-head { background: var(--ios-blur-bg); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border-bottom-color: var(--ios-hair); }
  .app-head .brand img { width: 18px; height: 18px; }
  .app-head .brand span { font-size: 17px; }
  .app-head .brand { gap: 6px; justify-self: start; min-height: 44px; }
  .head-title { justify-self: center; font-size: 17px; font-weight: 600; color: var(--ios-text); opacity: 0; transition: opacity 200ms ease; pointer-events: none; }

  body.ios-today .head-actions { justify-self: end; }

  .head-actions .icon-btn svg { width: 19px; height: 19px; stroke-width: 1.5; }
  body.ios-today .head-actions .icon-btn { background: var(--ios-card); color: var(--ios-text); box-shadow: var(--ios-shadow); }
  .ios-title { margin: var(--s2) 0 var(--s4); }

  .ios-title p { margin: 2px 0 0; font-size: 15px; line-height: 1.4; font-weight: 400; color: var(--ios-text2); }
  /* 2 · segmented control: slim sliding thumb */
  .th-tabs.two { position: relative; height: 36px; padding: 2px; margin: 0 0 var(--s5); border-radius: 999px; background: var(--ios-hair); grid-template-columns: 1fr 1fr; }
  .th-tabs.two .seg-thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / 2); border-radius: 999px; background: var(--ios-card); box-shadow: var(--ios-thumb-shadow); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform 250ms cubic-bezier(.2, .9, .3, 1); }
  .th-tabs.two button { position: relative; z-index: 1; min-height: 32px; font-size: 15px; font-weight: 500; color: var(--ios-text2); background: transparent; box-shadow: none; transition: color 200ms ease; }
  .th-tabs.two button::before { content: ''; position: absolute; inset: -6px 0; }              /* 44px hit area */
  .th-tabs.two button[aria-selected="true"] { background: transparent; box-shadow: none; color: var(--ios-text); font-weight: 600; }
  /* 3 · booking list: one white card per day, inset hairlines */
  body.ios-today .tr-list { background: var(--ios-card); border: 0; border-radius: var(--ios-radius); box-shadow: var(--ios-shadow); overflow: hidden; }
  body.ios-today .tr { position: relative; border-top: 0; gap: var(--s2); padding: 0 var(--s3) 0 var(--s4); transition: transform 120ms ease, background-color 120ms ease; }
  body.ios-today .tr + .tr::before { content: ''; position: absolute; top: 0; left: var(--s4); right: 0; height: 1px; background: var(--ios-hair); }

  body.ios-today .tr-main { padding: 14px 0; gap: 2px; }

  body.ios-today .tr-line { font-size: 15px; font-weight: 400; line-height: 1.35; color: var(--ios-text2); }
  body.ios-today .tr-day { margin: 0 0 var(--s5); }
  body.ios-today .tr-day h2 { display: flex; align-items: center; gap: var(--s2); margin: 0 var(--s4) var(--s2); font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ios-text2); }
  body.ios-today .tr-day.now h2 { color: var(--ios-gold); }
  .tr-today { padding: 2px 8px; border-radius: 999px; background: var(--ios-gold-tint); color: var(--ios-gold); font-size: 11px; font-weight: 600; letter-spacing: .04em; }
  body.ios-today .tr-none, body.ios-today .tr-quiet { margin: 0 var(--s4) var(--s5); font-size: 15px; color: var(--ios-text2); }

  /* 4 · status cues */
  .tr-pill { justify-self: start; display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; padding: 3px 9px; border-radius: 999px; background: var(--ios-gold-tint); color: var(--ios-text2); font-size: 12px; font-weight: 400; line-height: 1.3; }
  .tr-pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--ios-gold); }
  body.ios-today .tr .tick { width: 44px; height: 44px; border: 1.5px solid var(--ios-hair); border-color: color-mix(in srgb, var(--ios-text2) 45%, transparent); background: transparent; color: transparent; }
  body.ios-today .tr .tick svg { width: 18px; height: 18px; }
  body.ios-today .tr .tick[aria-pressed="true"] { background: var(--ios-success); border-color: var(--ios-success); color: #fff; }
  body.ios-today .tr .tick.pop { animation: ios-pop 300ms cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes ios-pop { 0% { transform: scale(.9); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
  body.ios-today .tr.done { opacity: .55; }
  /* 5 · bottom nav: floating pill kept (fewest changes), now labelled, translucent, and the page clears it */
  :root { --nav-h: 104px; }
  .navdock { gap: var(--s3); }
  .navdock .tabbar { gap: 0; padding: 4px; background: color-mix(in srgb, var(--ios-card) 80%, transparent); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--ios-hair); box-shadow: 0 1px 3px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .08); }
  .navdock .tabbar button { width: 58px; min-height: 52px; gap: 2px; color: var(--ios-text2); transition: transform 120ms ease, color 200ms ease, background-color 200ms ease; }
  .navdock .tabbar button:active { transform: scale(.96); }
  .navdock .tabbar button svg { width: 22px; height: 22px; stroke-width: 1.6; }
  .navdock .tabbar button span { position: static; width: auto; height: auto; overflow: visible; clip: auto; font-size: 10.5px; font-weight: 500; line-height: 1.2; letter-spacing: .01em; }
  .navdock .tabbar button[aria-current="page"] { background: var(--ios-gold-tint); color: var(--ios-gold); }
  .navdock .tabbar button[aria-current="page"] svg { fill: currentColor; fill-opacity: .22; }

  .navdock .navplus { width: 48px; height: 48px; background: var(--ios-gold); color: #fff; font-size: 28px; font-weight: 300; box-shadow: 0 1px 3px rgba(0, 0, 0, .08), 0 8px 20px rgba(0, 0, 0, .12); }

  .wrap.ios-fade { animation: ios-fade 200ms ease; }

  @media (max-width: 380px) { .navdock { gap: var(--s2); } .navdock .tabbar button { width: 50px; } .navdock .navplus { width: 48px; } }
  /* ===== iOS refresh END ===== */

  /* ---- shared notes, view-as-client banner (30 Oct 2026) ---- */
  .note-title { width: 100%; min-height: 44px; margin-top: 6px; border-radius: 14px; border: 1px solid var(--fill-hover); background: var(--card); padding: 0 14px; font-size: 16px; }

  .note-card p { font-size: 16px; line-height: 1.55; }
  .pv-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 60; min-height: 40px; padding: calc(4px + env(safe-area-inset-top)) 16px 4px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #1C1812; color: #F5F0E8; font-size: 14px; }

  body.previewing .app-head { top: calc(40px + env(safe-area-inset-top)); }

  /* ---- CRM: contacts table + pipeline board (desktop) ---- */
  .crm-table { display: none; }
  .pl-board { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .pl-col { background: var(--fill); border-radius: 16px; padding: 12px; min-width: 0; }
  .pl-col h2 { display: flex; justify-content: space-between; align-items: center; margin: 4px 6px 10px; font-size: 14px; font-weight: 600; }
  .pl-col h2 i { font-style: normal; font-size: 12px; color: var(--muted); background: var(--card); border-radius: 999px; padding: 2px 10px; }
  .pl-card { display: grid; gap: 4px; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; background: var(--card); border: 1px solid var(--edge); border-radius: 14px; font: inherit; color: inherit; min-height: 44px; }
  .pl-card span { font-size: 13px; color: var(--muted); }
  .pl-card .pl-foot { color: var(--gold-deep); font-weight: 500; }
  .pl-none { margin: 6px; font-size: 13px; color: var(--muted); }
  .stg { font-style: normal; display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--fill); color: var(--ink); }
  .stg-new { background: #E8EEF9; color: #2A4A8A; } .stg-booked { background: #E3F1E6; color: #1F6B37; } .stg-seen { background: var(--fill); } .stg-rebook { background: #F6EAD0; color: #7A5F25; }
  @media (min-width: 700px) { .pl-board { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1000px) {
    .pl-board { grid-template-columns: repeat(4, 1fr); }
    /* left sidebar for the admin (CRM layout); clients keep the floating pill */
    body:has(.navdock.crm) { padding-left: 232px; }
    .navdock.crm { left: 0; top: 0; bottom: 0; transform: none; width: 232px; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 8px; padding: 72px 12px 16px; background: var(--card); border-right: 1px solid var(--edge); z-index: 40; }
    .navdock.crm::before { content: 'haloe'; position: absolute; top: 20px; left: 26px; font-family: var(--font-wordmark, Georgia, serif); font-size: 30px; color: #111; }
    :root[data-theme="dark"] .navdock.crm::before { color: var(--gold); }
    .navdock.crm .tabbar { display: flex; flex-direction: column; width: 100%; gap: 2px; padding: 0; background: none; box-shadow: none; border: 0; -webkit-backdrop-filter: none; backdrop-filter: none; }
    .navdock.crm .tabbar button { width: 100%; min-height: 44px; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 14px; border-radius: 12px; }
    .navdock.crm .tabbar button span { position: static; width: auto; height: auto; clip: auto; overflow: visible; font-size: 15px; }
    .navdock.crm .navplus { width: 100%; height: 44px; border-radius: 12px; font-size: 0; line-height: 1; box-shadow: none; display: flex; align-items: center; justify-content: center; }
    .navdock.crm .navplus::after { content: '+ New booking'; font-size: 15px; font-weight: 600; }
    body:has(.navdock.crm) .app-head .brand { visibility: hidden; }
    body:has(.crm-table) .wrap { max-width: 1180px; }
    body:has(.pl-board) .wrap { max-width: 1280px; }
    .crm-table { display: block; margin-top: 12px; background: var(--card); border: 1px solid var(--edge); border-radius: 16px; overflow: hidden; }
    .cl-stack { display: none; }
    .crm-th, .crm-tr { display: grid; grid-template-columns: minmax(220px, 2.2fr) 1fr 1fr .8fr 1.8fr; gap: 12px; align-items: center; padding: 12px 18px; text-align: left; }
    .crm-th { background: var(--fill); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .crm-tr { width: 100%; border: 0; border-top: 1px solid var(--edge); background: transparent; font: inherit; color: inherit; min-height: 60px; cursor: pointer; }
    @media (hover: hover) { .crm-tr:hover { background: var(--fill); } }
    .crm-c { display: grid; gap: 2px; min-width: 0; } .crm-c i { font-style: normal; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .crm-tr > span { font-size: 14px; min-width: 0; }
  }

  /* ---- sign-in polish (30 Oct 2026): calm rounded fields, one clean focus ring, even 8/16/24 rhythm ---- */
  .arrival { padding-left: 24px; padding-right: 24px; }
  .arr-mark { width: 56px; height: 56px; }
  .arr-word { font-size: 64px; margin-top: 20px; }
  .arr-tag { font-size: 12px; letter-spacing: .24em; padding-left: .24em; margin-top: 12px; }
  .arr-lower { padding-top: 40px; }
  .arr-h { font-size: 28px; margin: 0 0 8px; }
  .arr-sub { margin: 0 0 28px; }
  .arrival .arr-label { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 8px 4px; }
  .arrival .arr-input { height: 56px; padding: 0 18px; border: 1.5px solid color-mix(in srgb, var(--ink) 16%, transparent); border-radius: 16px; background: var(--card); box-shadow: none; transition: border-color .15s ease, box-shadow .15s ease; }
  .arrival .arr-input:focus, .arrival .arr-input:focus-visible { outline: none; border-color: var(--gold-deep); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold) 30%, transparent); }
  .arrival .arr-input:-webkit-autofill, .arrival .arr-input:-webkit-autofill:focus { -webkit-box-shadow: 0 0 0 100px var(--card) inset; box-shadow: 0 0 0 100px var(--card) inset; border-radius: 16px; }
  .arrival .arr-field .arr-input { padding-right: 56px; }
  .arrival .arr-eye { right: 6px; top: 6px; }
  .arrival .arr-code { padding: 0; letter-spacing: .4em; text-indent: .4em; }
  .arrival .arr-label[style] { margin-top: 20px !important; }
  .arr-btn { margin-top: 28px; }
  .arr-err { min-height: 22px; margin: 12px 4px 0; text-align: center; }
  .arr-textbtn { margin-top: 8px; font-size: 15px; }
  .arr-textbtn + .arr-textbtn { margin-top: 0; }
  .arr-foot { margin-top: 24px; }
</style>

/** Client Settings: allow quiet aftercare reminders (day 1 and day 7) on this device. */
async function initClientPushCard() {

  const draw = (html) => { const b = document.getElementById('cpushBody'); if (b) b.innerHTML = html; };
  const intro = '<p class="muted small" style="margin:0 0 6px">A quiet reminder on day 1 and day 7 after a session. It never shows any detail.</p>';
  if (!pushApi.supported()) return draw(intro + (pushApi.isIOS() && !isStandalone() ? '<p class="muted small" style="margin:0">On iPhone, first add haloe to your Home Screen (Share → Add to Home Screen), then open it from there.</p>' : '<p class="muted small" style="margin:0">This browser can’t show reminders.</p>'));
  if (pushApi.permission() === 'denied') return draw(intro + '<p class="muted small" style="margin:0">Reminders are blocked for haloe on this device. Allow notifications in your browser or phone settings to turn them on.</p>');
  let sub = null, row = null;
  try { sub = pushApi.permission() === 'granted' ? await pushApi.getSub() : null; if (sub) row = await api.getPushRow(sub.toJSON().endpoint); } catch (e) { return draw(intro + '<p class="muted small" style="margin:0">Couldn’t load this setting just now.</p>'); }
  const on = !!(sub && row);
  draw(intro + '<div class="toggle-line" style="margin:2px 0"><span>Reminders on this device</span><button class="switch-wrap" id="cpushMain" aria-label="Reminders on this device"><span class="switch" role="switch" aria-checked="' + on + '"></span></button></div>');
  document.getElementById('cpushMain').onclick = async () => {
    try {
      if (on) { const ep = sub.toJSON().endpoint; await pushApi.unsubscribe(sub); await api.deletePushRow(ep); }
      else {
        const perm = await pushApi.requestPermission();
        if (perm !== 'granted') { toastMsg('Reminders weren’t allowed on this device'); return initClientPushCard(); }

  };

/** Build the practitioner brief + the ACT ON THIS flags from the stored answers. */
function buildFlags(client, intake) {
  const flags = [];
  if (!intake) { flags.push({ t: 'No intake form yet', d: 'Nothing on file for screening, medications, allergies, consent or signature. Ask in person before you start.' }); return flags; }
  const yes = SAFETY.filter(([k]) => { const v = trimStr(intake[k]); return v && lower(v) !== 'no'; });
  for (const [k, label] of yes) {
    const v = trimStr(intake[k]);
    flags.push({ t: label, d: lower(v) === 'yes' ? 'Answered Yes' : 'Answered: ' + v });
  }
  if (yes.length && trimStr(intake.safety_notes)) flags.push({ t: 'Their safety note', d: '“' + trimStr(intake.safety_notes) + '”' });
  const meds = trimStr(intake.current_medications);
  if (meds && CLOT_RE.test(meds)) {
    const hit = meds.match(CLOT_RE)[0];
    flags.push({ t: 'Medication on the clotting watch-list: ' + hit.toLowerCase(), d: 'As typed: “' + meds.replace(/\s+/g, ' ') + '”' });
  }
  if (lower(intake.is_pregnant) === 'yes' || lower(intake.breastfeeding) === 'yes') { /* already listed above */ }
  if (!trimStr(intake.main_concern)) flags.push({ t: 'No main concern given', d: 'The main-concern box was left blank. Ask what they want from the session.' });
  const own = norm10(client && client.phone), emer = norm10(intake.emergency_contact_phone);
  if (own && emer && own === emer) flags.push({ t: 'Emergency contact is their own number', d: 'Ask for someone else.' });
  if (!own && !emer) { /* nothing */ }
  return flags;
}

const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a10.5 10.5 0 0 0 4.2-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

/** Classify a Supabase Auth error without ever exposing its text. 'rejected' = wrong password / unknown email / bad or expired
 *  code — deliberately ONE bucket, so no screen can reveal which it was. */
function authKind(error) {
  if (!error) return 'ok';
  if (navigator.onLine === false) return 'offline';
  const st = error.status, code = String(error.code || ''), msg = String(error.message || ''), name = String(error.name || '');
  if (st === 429 || /rate_limit|over_.*_rate/i.test(code) || /rate limit|too many/i.test(msg)) return 'rate';
  if (st === 0 || /RetryableFetch/i.test(name) || /failed to fetch|network|load failed|aborted/i.test(msg)) return 'network';
  if (st === 400 || st === 401 || st === 403 || st === 422) return 'rejected';
  return 'failed';
}
/** Run one Auth call with the offline pre-check and the 12 s limit. Resolves { kind, data, error } — never throws. */
async function authRun(fn) {
  if (navigator.onLine === false) return { kind: 'offline' };
  const giveUp = new Promise((res) => setTimeout(() => res({ kind: 'timeout' }), TIMEOUT_MS + 500));
  const call = Promise.resolve().then(fn).then((r) => ({ kind: authKind(r && r.error), data: r && r.data, error: r && r.error }), () => ({ kind: navigator.onLine === false ? 'offline' : 'network' }));
  return Promise.race([call, giveUp]);
}
/** The calm line for a failed attempt. `rejectedMsg` says what 'rejected' means on this screen. */
function authMsg(kind, rejectedMsg) {
  if (kind === 'offline') return OFFLINE_MSG;
  if (kind === 'rate') return MSG_RATE;
  if (kind === 'rejected') return rejectedMsg;
  return MSG_GENERIC;
}
/** Email a 6-digit code (also used by "Forgot password?"). Sign-ups stay ON so anyone can start; what a signed-in user can SEE is
 *  decided entirely by row-level security (admin → everything; client → only their own rows). */
const sendCode = (email) => authRun(() => sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + '/app/' } }));
const sendMsg = (r) => (r.kind === 'offline' ? OFFLINE_MSG : r.kind === 'rate' ? MSG_RATE : SEND_FAILED_MSG);   // any other failure sending a code: the calm "didn't send" line

const arrivalFoot = (kind) => kind === 'help'

/** Show / hide toggle for a password field (aria-pressed, 44px target). */
function wireEye(inputId, btnId, otherId) {
  const b = document.getElementById(btnId); if (!b) return;
  b.onclick = () => {
    const show = b.getAttribute('aria-pressed') !== 'true';
    [inputId, otherId].filter(Boolean).forEach((id) => { const i = document.getElementById(id); if (i) i.type = show ? 'text' : 'password'; });
    b.setAttribute('aria-pressed', String(show)); b.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); b.innerHTML = show ? EYE_OFF : EYE_ON;
  };
}

/** 2b. Type the 6-digit code (auto-submits on the 6th digit). */
function viewEnterCode() {
  $root.innerHTML = loginHeaderHTML() + `<main class="arrival">${arrivalBrand()}
    <section class="arr-lower"><h1 class="arr-h" tabindex="-1">Enter your code.</h1>
      <p class="arr-sub">We've sent a 6-digit code to <b>${esc(S.loginEmail)}</b></p>
      <form id="codeForm" novalidate><label class="arr-label" for="code">6-digit code</label>
        <input class="arr-input arr-code" id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="${CODE_LENGTH}" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="${'·'.repeat(CODE_LENGTH)}">
        <button class="arr-btn" id="codeBtn" type="submit" disabled>Confirm code</button><p class="arr-err" id="codeMsg" role="status" aria-live="polite"></p></form>
      <div class="arr-card" style="margin-top:18px"><p class="t">Check your inbox.</p><p class="s">The code expires in 10 minutes. Can't see it? Check your spam folder.${LEGACY_EMAIL_LINK_SIGNIN ? ' You can also tap the link in the email.' : ''}</p></div>
      <button class="arr-btn ghost" id="resendBtn" type="button" disabled>Send again in 0:${RESEND_SECONDS}</button><p class="arr-err" id="resendMsg" role="status" aria-live="polite"></p>
      <button class="arr-textbtn" id="otherEmail" type="button">Use a different email</button></section>
    ${arrivalFoot('help')}</main>`;
  wireHeader();
  const h = document.querySelector('.arr-h'); if (h) h.focus({ preventScroll: true });
  const input = document.getElementById('code'), btn = document.getElementById('codeBtn');
  let busy = false;
  const submit = async () => {
    const token = input.value.replace(/\D/g, '');
    if (token.length !== CODE_LENGTH || busy) return;
    const msg = document.getElementById('codeMsg'); msg.textContent = '';
    if (navigator.onLine === false) { msg.textContent = OFFLINE_MSG; return; }
    busy = true; btn.disabled = true; btn.textContent = 'Checking…';
    const prevForce = S.forcePassword; S.forcePassword = true;   // a code sign-in ALWAYS ends in "Create your password" (see needsPassword)
    const seq = S.sendSeq = (S.sendSeq || 0) + 1;
    const r = await authRun(() => sb.auth.verifyOtp({ email: S.loginEmail, token, type: 'email' }));
    if (seq !== S.sendSeq) return;
    busy = false;
    if (r.kind === 'ok') return;                             // SIGNED_IN → enter() → "Create your password"
    S.forcePassword = prevForce;
    const m2 = document.getElementById('codeMsg'), b2 = document.getElementById('codeBtn'), i2 = document.getElementById('code');
    if (m2) m2.textContent = authMsg(r.kind, MSG_CODE);
    if (b2) { b2.textContent = 'Confirm code'; b2.disabled = !i2 || i2.value.replace(/\D/g, '').length !== CODE_LENGTH; }
    if (i2 && r.kind === 'rejected') { i2.value = ''; if (b2) b2.disabled = true; i2.focus(); }
  };
  input.oninput = () => { const d = input.value.replace(/\D/g, '').slice(0, CODE_LENGTH); if (input.value !== d) input.value = d; btn.disabled = d.length !== CODE_LENGTH || busy; if (d.length === CODE_LENGTH) submit(); };
  document.getElementById('codeForm').onsubmit = (e) => { e.preventDefault(); submit(); };
  const rbtn = document.getElementById('resendBtn');
  const tick = () => {
    const el = document.getElementById('resendBtn'); if (!el) { clearInterval(S.loginTimer); return; }
    const left = Math.max(0, Math.ceil((S.resendAt - Date.now()) / 1000));
    if (left > 0) { el.disabled = true; el.textContent = 'Send again in ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); }
    else { el.disabled = false; el.textContent = 'Send again'; clearInterval(S.loginTimer); }
  };
  S.loginTimer = setInterval(tick, 500); tick();
  rbtn.onclick = async () => {
    const rm = document.getElementById('resendMsg'); rm.textContent = '';
    if (navigator.onLine === false) { rm.textContent = OFFLINE_MSG; return; }
    rbtn.disabled = true; rbtn.textContent = 'Sending…';
    const seq = S.sendSeq = (S.sendSeq || 0) + 1;
    const r = await sendCode(S.loginEmail);
    if (seq !== S.sendSeq || !document.getElementById('resendBtn')) return;
    if (r.kind !== 'ok') { document.getElementById('resendMsg').textContent = sendMsg(r); clearInterval(S.loginTimer); S.loginTimer = setInterval(tick, 500); tick(); return; }
    S.resendAt = Date.now() + RESEND_SECONDS * 1000; toastMsg('Code sent again');
    clearInterval(S.loginTimer); S.loginTimer = setInterval(tick, 500); tick();
  };
  document.getElementById('otherEmail').onclick = () => { S.sendSeq = (S.sendSeq || 0) + 1; S.loginStage = 'email'; S.loginEmail = ''; viewLogin(); };
}

/** Must this signed-in person create a password before anything else? Yes if none is recorded on the account (user_metadata
 *  .password_set — this covers every existing account, admin included), OR they got in by a code / a sign-in link in this visit.
 *  The second rule matters: user_metadata can be written by whoever first registers an email, so a code or link sign-in can never
 *  be trusted to mean "this person already chose their own password". */
function needsPassword(session) {
  if (!session || !session.user) return false;
  if (S.passwordSkipped === session.user.id) return false;      // "Not now" (only offered while LEGACY_EMAIL_LINK_SIGNIN)
  const meta = session.user.user_metadata || {};
  return meta.password_set !== true || !!S.forcePassword;
}

        <label class="arr-label" for="np2" style="margin-top:18px">Confirm password</label>

      ${LEGACY_EMAIL_LINK_SIGNIN ? '<button class="arr-textbtn" id="npLater" type="button">Not now</button>' : ''}

  if (later) later.onclick = () => { const s = S.session; S.passwordSkipped = s.user.id; S.needPassword = false; enter(s); };
  document.getElementById('npForm').onsubmit = async (e) => {
    e.preventDefault();
    const a = document.getElementById('np'), b = document.getElementById('np2'), btn = document.getElementById('npBtn'), msg = document.getElementById('npMsg'); msg.textContent = '';
    if (a.value.length < MIN_PASSWORD) { msg.textContent = `Use at least ${MIN_PASSWORD} characters.`; a.focus(); return; }
    if (a.value !== b.value) { msg.textContent = "The two passwords don't match."; b.focus(); return; }
    if (navigator.onLine === false) { msg.textContent = OFFLINE_MSG; return; }
    btn.disabled = true; btn.textContent = 'Saving…';
    const seq = S.sendSeq = (S.sendSeq || 0) + 1;
    const r = await authRun(() => sb.auth.updateUser({ password: a.value, data: { password_set: true } }));
    if (seq !== S.sendSeq) return;
    if (r.kind === 'ok') {
      S.needPassword = false; S.forcePassword = false; S.passwordSkipped = null;
      const s = { ...S.session, user: (r.data && r.data.user) || { ...S.session.user, user_metadata: { ...(S.session.user.user_metadata || {}), password_set: true } } };
      await enter(s); toastMsg('Password saved');
      return;
    }
    const m2 = document.getElementById('npMsg'), b2 = document.getElementById('npBtn');
    const code = String((r.error && r.error.code) || '');
    const weak = code === 'weak_password' || /weak|should contain|at least \d+ char|password.*(requirement|strength|pwned|leak)/i.test(String((r.error && r.error.message) || ''));
    if (m2) m2.textContent = r.kind === 'rejected' ? (weak ? PASSWORD_RULE : code === 'same_password' ? 'Please choose a password you have not used here before.' : 'Please choose a different password.') : authMsg(r.kind, MSG_GENERIC);
    if (b2) { b2.disabled = false; b2.textContent = 'Save password'; }
  };
}

/* ---- Today ---- */
/* ---- the three glance lines on a session card (admin only; her intake words, verbatim, no interpretation) ----
 * Real intake fields:  package  ("Which package or treatment are you booking?")
 *                      main_concern  ("What would you most like help with?")
 *                      takes_medication ("Are you currently taking any medication or supplements?" Yes/No) + current_medications ("Please list them")
 * Nothing here is ever sent in a push, an email or shown on a client-facing page. */
const normPkg = (t) => String(t || '').split(' — ')[0].trim().toLowerCase();
/** Does what she chose on the intake differ from what was booked? Only a real mismatch is flagged. */
function packageDiffers(chosen, bookedTreatment) {
  const c = normPkg(chosen), bk = String(bookedTreatment || '').trim().toLowerCase();
  if (!c || c === 'not sure yet') return false;
  if (c === 'single treatment') return PACKAGE_NAMES.some((p) => p.toLowerCase() === bk);   // she said single treatment but a package was booked
  return c !== bk;
}
const firstLineOf = (t) => String(t).split(/\r?\n/)[0];
const durLabel = (min) => { const h = Math.floor(min / 60), m = min % 60; return h && m ? h + ' hr ' + m + ' min' : h ? (h === 1 ? '1 hour' : h + ' hours') : m + ' min'; };
/** The four-row grid, always in this order: CHOSE · BOOKED · WHY · MEDICATION (same look on the client profile brief). */
function glanceHTML(b, feature) {
  const intake = b.client_id ? intakeOf(b.client_id) : null;
  const key = b.client_id ? 'c/' + b.client_id : 'b/' + b.id;
  // CHOSE — what she chose on the intake; BOOKED — what she booked, with a small gold "Differs" tag if they don't match
  const chosen = intake ? trimStr(intake.package) : '';

 * First name + initial only. No medication, no health wording, no client levels or labels — the gamification is about the admin's own
 * actions (rebook nudges, streak), never about clients. */
const REBOOK_AFTER_DAYS = 14;        // a client is "due to rebook" when their last session was this many days ago or more, and nothing is booked
const REBOOK_GOAL = 3;               // nudges per week (the week resets on Monday)
/** The WhatsApp wording — one constant, edit it here. {first name} is filled in. Halima sends it herself from WhatsApp. */
const REBOOK_MESSAGE = "Hi {first name}, it's Halima from haloe. It's been a little while since your last session. If you'd like to book your next one, you can do it here: https://haloe.health/book. Or just reply and I'll find a time that suits you.";

const pastSessions = (p, t) => p.bookings.filter((b) => confirmed(b) && b.booking_date < t).map((b) => b.booking_date).sort();
const lastSession = (p, t) => { const a = pastSessions(p, t); return a.length ? a[a.length - 1] : null; };
/** THE rebook rule, shared by Today's task count and the Clients tile: has had a session, has nothing booked, and the last session was
 *  REBOOK_AFTER_DAYS or more days ago. */
function isDueToRebook(p, t) {
  const last = lastSession(p, t);
  return !!last && !nextBookingDate(p) && daysBetween(last, t) >= REBOOK_AFTER_DAYS;
}
const dueToRebook = (t) => people().filter((p) => isDueToRebook(p, t)).sort((a, b) => lastSession(a, t).localeCompare(lastSession(b, t)));

/* nudge log (admin-only table rebook_nudges) */
const nudgeKey = (n) => (n.client_id ? 'c/' + n.client_id : 'e/' + lower(n.client_email));
const nudgeDay = (n) => ldn(new Date(n.sent_at));
const mineNudges = () => (S.data.nudges || []).filter((n) => !n.sent_by || !S.session || n.sent_by === S.session.user.id);
/** distinct people nudged in the Monday-to-Sunday week that starts on `mon` (this admin only) */
const weekNudgeCount = (mon) => new Set(mineNudges().filter((n) => mondayOf(nudgeDay(n)) === mon).map(nudgeKey)).size;
/** Consecutive weeks with the goal met. The current week counts if it is already met; if it is still in progress it doesn't break the streak. */
function nudgeStreak(t) {
  const cw = mondayOf(t); let w = weekNudgeCount(cw) >= REBOOK_GOAL ? cw : addDays(cw, -7), n = 0;
  while (weekNudgeCount(w) >= REBOOK_GOAL) { n++; w = addDays(w, -7); }
  return n;
}
/** the latest nudge sent (by anyone) to this person since their last session, or null */
function nudgeSince(p, t) {
  const last = lastSession(p, t) || '';
  const k = personKey(p), hits = (S.data.nudges || []).filter((n) => nudgeKey(n) === k && nudgeDay(n) >= last).sort((a, b) => String(b.sent_at).localeCompare(String(a.sent_at)));
  return hits[0] || null;
}

/* ---- Progress (check-ins) ---- */
// Scores and the client's own words only — labels are Concern / Energy / Sleep / Pain areas.
const shortDate = (ms) => new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'Europe/London' });
function checkinsOf(c) { return c ? S.data.checkins.filter((x) => x.client_id === c.id).sort((a, b) => new Date(a.taken_at) - new Date(b.taken_at)) : []; }
function pts(list, key) { return list.filter((x) => x[key] != null).map((x) => ({ t: new Date(x.taken_at).getTime(), v: x[key] })); }
/** Thin gold line, soft fill, 0–10 axis. `lines` = [{pts, cls, dot, fill}]. */
function chartSVG(lines) {
  const W = 320, H = 168, L = 24, R = 10, T = 10, B = 24;
  const all = lines.flatMap((l) => l.pts); if (!all.length) return '';
  const t0 = Math.min(...all.map((p) => p.t)), t1 = Math.max(...all.map((p) => p.t));
  const x = (t) => (t1 === t0 ? (L + W - R) / 2 : L + ((t - t0) / (t1 - t0)) * (W - L - R));
  const y = (v) => T + ((10 - v) / 10) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".30"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>`;
  for (const g of [0, 5, 10]) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}"/><text class="ax" x="${L - 6}" y="${y(g) + 3.5}" text-anchor="end">${g}</text>`;
  for (const l of lines) {
    if (!l.pts.length) continue;
    const d = l.pts.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
    if (l.fill && l.pts.length > 1) s += `<path d="${d} L${x(l.pts[l.pts.length - 1].t).toFixed(1)} ${H - B} L${x(l.pts[0].t).toFixed(1)} ${H - B} Z" fill="url(#pg)"/>`;
    s += `<path class="${l.cls}" d="${d}"/>` + l.pts.map((p) => `<circle class="${l.dot}" cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5"/>`).join('');
  }
  s += `<text class="ax" x="${L}" y="${H - 6}">${shortDate(t0)}</text><text class="ax" x="${W - R}" y="${H - 6}" text-anchor="end">${t1 === t0 ? '' : shortDate(t1)}</text></svg>`;
  return s;
}
function progressBody(list, mode) {
  const yearAgo = Date.now() - 365 * 864e5;
  const L12 = list.filter((x) => new Date(x.taken_at).getTime() >= yearAgo);
  const delta = (label, p) => (p.length >= 2 ? `${label} ${p[0].v} → ${p[p.length - 1].v}` : null);
  if (mode === 'concern') {
    const c = pts(L12, 'concern_score');
    if (c.length < 2) return '<p class="muted small">Not enough readings yet.</p>';
    return `${chartSVG([{ pts: c, cls: 'ln', dot: 'dot', fill: true }])}<div class="delta">${delta('Concern', c)} since ${shortDate(c[0].t)}</div>`;
  }
  const e = pts(L12, 'energy'), sl = pts(L12, 'sleep');
  if (e.length < 2 && sl.length < 2) return '<p class="muted small">Not enough readings yet.</p>';
  const first = Math.min(...[e[0], sl[0]].filter(Boolean).map((p) => p.t));
  const ds = [delta('Energy', e), delta('Sleep', sl)].filter(Boolean).join(' · ');
  return `${chartSVG([{ pts: e, cls: 'ln', dot: 'dot', fill: true }, { pts: sl, cls: 'ln2', dot: 'dot2' }])}
    <div class="legend"><span><i></i>Energy</span><span><i class="d"></i>Sleep</span></div><div class="delta">${ds} since ${shortDate(first)}</div>`;
}
function progressCard(list) {
  if (list.length < 2) return `<div class="card"><div class="section-label">Progress</div><p class="muted" style="margin:10px 0 0">After your next session this will show their progress.</p></div>`;

}

/* ---- Milton Hall lock-up rule (admin side) ----
 * start + the treatment's REAL duration + tidy-up must be <= closing time (CLINIC_RULES in /clinic-rules.js — the one place to change it).
 * Durations come from the catalogue (/services-data.js), never guessed. Home visits are exempt. */
function svcMinutes(svc) {
  if (Number(svc.sessionMin) > 0) return Number(svc.sessionMin);
  const hr = /(\d+)\s*(?:hours?|hrs?|hr)\b/i.exec(svc.time || ''), mn = /(\d+)\s*min/i.exec(svc.time || '');
  const total = (hr ? parseInt(hr[1], 10) * 60 : 0) + (mn ? parseInt(mn[1], 10) : 0);
  return total > 0 ? total : null;                                    // null = no duration stored
}
/** The booking's real treatment length in minutes, or null if it can't be determined from the data. */
function bookingDurationMin(b) {
  if (Array.isArray(b.treatments) && b.treatments.length) {            // multi-treatment booking: the stored list carries each real length
    const sum = b.treatments.reduce((n, t) => n + (Number(t.min) || 0), 0);
    if (sum > 0) return sum;
  }
  const blocked = (b.end_min || 0) - (b.start_min || 0);
  const cands = [];
  for (const list of Object.values(SERVICES)) for (const svc of list) if (lower(svc.name) === lower(b.treatment)) { const m = svcMinutes(svc); if (m) cands.push(m); }
  if (!cands.length) return null;
  // the same name exists as dry AND wet cupping at different lengths: pick the one the stored blocked interval agrees with
  return cands.find((d) => blocked === d || blocked === d + 15) || Math.max(...cands);
}
const closingLabel = (min) => { const h = Math.floor(min / 60), m = min % 60; return ((h + 11) % 12 + 1) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'am' : 'pm'); };
/** null if the time is fine (or not Milton Hall); otherwise the calm explanation. */
function clinicOverrunMessage(b, startMin) {
  if (!b || b.location !== 'clinic' || !window.CLINIC_RULES) return null;
  const dur = bookingDurationMin(b); if (!dur) return null;
  const R = CLINIC_RULES;
  if (R.fits(startMin, dur)) return null;
  return 'This would finish at ' + fmtTime(R.finishMin(startMin, dur)) + '. The clinic closes at ' + closingLabel(R.closingMin) + '. Latest start for this treatment is ' + fmtTime(R.latestStart(dur)) + '.';
}

    };

}
